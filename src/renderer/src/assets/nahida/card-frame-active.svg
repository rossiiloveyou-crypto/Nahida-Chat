<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="100%" height="100%" fill="none" preserveAspectRatio="none">
  <!-- Card Background -->
  <rect x="8" y="8" width="224" height="84" rx="16" fill="#ECF5E6" />
  <!-- Outer Solid Border -->
  <rect x="8" y="8" width="224" height="84" rx="16" stroke="#9CBF8E" stroke-width="1.6" />
  <!-- Inner Dashed Stitch Line -->
  <rect x="13" y="13" width="214" height="74" rx="12" stroke="#7BA66A" stroke-width="1.2" stroke-dasharray="4 3" />
  <!-- Top-Right 4-Petal Flower -->
  <g transform="translate(224, 14)" fill="#6E9857">
    <path d="M0 -7 C1.5 -2.5 2.5 -1.5 7 0 C2.5 1.5 1.5 2.5 0 7 C-1.5 2.5 -2.5 1.5 -7 0 C-2.5 -1.5 -1.5 -2.5 0 -7 Z" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
  <!-- Bottom-Left Leaves -->
  <g transform="translate(14, 86)" fill="#6E9857">
    <path d="M-2 -2 C-7 -1 -10 3 -8 7 C-4 7 0 4 -2 -2 Z" />
    <path d="M-2 -2 C-3 -7 1 -10 5 -8 C5 -4 2 0 -2 -2 Z" />
  </g>
  <!-- Top-Left & Bottom-Right Leaf Buds -->
  <circle cx="12" cy="12" r="2" fill="#6E9857" />
  <circle cx="226" cy="88" r="2" fill="#6E9857" />
</svg>